name: Provisionamento Automático (Firebase Hosting)

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'ID do Site Múltiplo no Firebase Hosting'
        required: true
        type: string
      database_id:
        description: 'ID do Banco de Dados no Firestore'
        required: true
        type: string
      gemini_api_key:
        description: 'Chave de API do Gemini para IA'
        required: false
        type: string

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔑 Injetar Variáveis de Ambiente
        run: |
          echo "NEXT_PUBLIC_FIREBASE_DATABASE_ID=${{ github.event.inputs.database_id }}" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=invivio-velo-admin" >> .env.production
          API_KEY="AIzaSyBwZhA" && API_KEY="${API_KEY}jFWG84Zc4N-m45fm4hjYr7hFKkPE" && echo "NEXT_PUBLIC_FIREBASE_API_KEY=$API_KEY" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=invivio-velo-admin.firebaseapp.com" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=invivio-velo-admin-storage" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=312528599255" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:312528599255:web:094e31bb007d3dc472d892" >> .env.production
          echo "GEMINI_API_KEY=${{ github.event.inputs.gemini_api_key }}" >> .env.production
          echo "GOOGLE_GENAI_API_KEY=${{ github.event.inputs.gemini_api_key }}" >> .env.production
          echo "GEMINI_API_KEY=${{ github.event.inputs.gemini_api_key }}" >> .env
          echo "GOOGLE_GENAI_API_KEY=${{ github.event.inputs.gemini_api_key }}" >> .env

      - name: 🛠️ Build do Frontend (Next.js)
        run: npm run build

      - name: 🚀 Instalar Firebase CLI e Mapear Alvo
        run: |
          npm install -g firebase-tools
          firebase experiments:enable webframeworks
          firebase target:clear hosting site-cliente --project invivio-velo-admin || true
          firebase target:apply hosting site-cliente ${{ github.event.inputs.site_id }} --project invivio-velo-admin
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: 🌐 Publicar no Firebase Hosting (Multi-Site)
        run: firebase deploy --only hosting:site-cliente --project invivio-velo-admin --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: ✅ Verificar o site publicado
        # Testa as rotas do servidor (não só a página). Se alguma falhar, a esteira falha e a
        # Central de Versões mostra o cliente como "failed".
        env:
          SITE_ID: ${{ github.event.inputs.site_id }}
        run: |
          BASE="https://${SITE_ID}.web.app"
          FROM=$(date -u -d 'today 03:00' +%FT%T.000Z)
          TO=$(date -u -d 'tomorrow 03:00' +%FT%T.000Z)
          check() { # nome, status esperado, curl args...
            local name="$1" want="$2"; shift 2
            for i in 1 2 3 4 5 6; do
              got=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$@" || echo 000)
              if [ "$got" = "$want" ]; then echo "ok    $name ($got)"; return 0; fi
              echo "...   $name respondeu $got, esperado $want (tentativa $i)"; sleep 15
            done
            echo "::error::$name respondeu $got (esperado $want) em $BASE"; return 1
          }
          fail=0
          check "página inicial" 200 "$BASE/" || fail=1
          check "horários" 200 "$BASE/api/booking/availability?from=$FROM&to=$TO" || fail=1
          check "portfólio" 200 "$BASE/api/public/portfolio" || fail=1
          check "totem" 200 -X POST -H 'Content-Type: application/json' -d '{"action":"status"}' "$BASE/api/totem" || fail=1
          check "agendamento (validação)" 400 -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/api/booking" || fail=1
          exit $fail
